<!DOCTYPE html>
<html lang="en">
<head>
    <title>Librarian Dashboard</title>
    <link rel="stylesheet" href="/static/lib_form.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
    <body>
        <div id="main">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                    <a class="navbar-brand" href="#">Librarian's Dashboard</a>
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="/librarian_dash">Home</a>
                        <a class="nav-link active" aria-current="page" href="/requests">Requests</a>
                        <a class="nav-link active" aria-current="page" href="/stats">Stats</a>
                        <a class="nav-link active" aria-current="page" href="/">Logout</a>
                        <span>
                        <a class="nav-link active" aria-current="page" href="#">Admin</a>
                        </span>
                    </div>
                    </div>
                </nav>
                <h4 id="headings">Edit book</h4>
                <form action="/update_book/{{book.id}}" method="POST">
                    <div id="lib-form">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title:</label>
                            <input type="text" class="form-control" id="tile" minlength="5" maxlength="50" name="title" value="{{book.title}}" required> 
                        </div>

                        <div class="mb-3">
                            <label for="author" class="form-label">Author:</label>
                            <input type="text" class="form-control" id="author" minlength="5" maxlength="30" name="author" value="{{book.author}}" required>
                        </div>

                        <div class="mb-3">
                            <label for="section_title" class="form-label">Section:</label>
                            <input type="text" class="form-control" id="section_title"  minlength="5" maxlength="20" name="section_title" value="{{book.section.title}}" required>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">Content:</label>
                            <textarea type="text" class="form-control" id="content" rows="2" minlength="5" name="content" required>{{book.content}}</textarea>
                        </div>

                        <div>
                            <a href="/section/{{book.section_id}}"><button type="button" class="btn btn-danger" style="float: left; margin-left: 30px;">cancel</button></a>
                            <button type="submit" class="btn btn-success" style="float: right; margin-right: 50px";>update</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
