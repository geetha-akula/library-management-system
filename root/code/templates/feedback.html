<!DOCTYPE html>
<html lang="en">

<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="/static/lib_form.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="dashboard">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">User's Dashboard</a>
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="/user/{{user.id}}">Home</a>
                        <a class="nav-link active" aria-current="page" href="/user/{{user.id}}/my_books">MyBooks</a>
                        <a class="nav-link active" aria-current="page" href="/">Logout</a>
                        <span>
                            <a class="nav-link active" aria-current="page" href="#">{{user.username}}</a>
                        </span>
                    </div>
                </div>
        </div>
        </nav>
        <h4 id="headings">Give feedback for "{{book.title}}"</h4>
        <form action="/user/{{user.id}}/feedback/{{book.id}}" method="POST">
            <div id="lib-form">
                <label for="title" class="form-label">Title:</label>
                <div class="mb-3">
                    <input type="text" class="form-control" id="title" name="title" value="{{book.title}}" readonly>
                </div>

                <label for="author" class="form-label">Author:</label>
                <div class="mb-3">
                    <input type="text" class="form-control" id="author" name="author" value="{{book.author}}" readonly>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Feedback:</label>
                    <textarea class="form-control" id="message" rows="2" name="message" maxlength="500"></textarea>
                </div>

                <div>
                    <a href="/user/{{user.id}}/my_books"><button type="button" class="btn btn-danger"
                            style="float: left; margin-left: 30px;">cancel</button></a>
                    <button type="submit" class="btn btn-success" style="float: right; margin-right: 50px"
                        ;>submit</button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
