<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Login Form</title>
    <link rel="stylesheet" href="/static/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="form-body">
            <div style="text-align: center;"><h2>Admin Login</h2></div>
            <br>
            <form action="/adminlogin" method="post">
            <div class="mb-3">
                <label for="a_name" class="form-label">Username</label>
                <input type="text" class="form-control" id="a_name" name="username" minlength="4" size="10" required>
            </div>
            <div class="mb-3">
                <label for="pwd" class="form-label">Password</label>
                <input type="password" class="form-control" id="pwd" name="pwd" minlength="4" size="10" required>
            </div>
            <div style="text-align: center;">
                <input type="submit" class="btn btn-dark" value="Login">
            </div>
            </form>
        </div>
    </div>
</body>
</html>
