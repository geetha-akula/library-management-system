<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register Form</title>
    <link rel="stylesheet" href="/static/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="form-body">
                <div style="text-align: center;"><h2>Register Form</h2></div>
                <br>
                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="u_name" class="form-label">Username</label>
                        <input type="text" class="form-control" id="u_name" placeholder="username123" minlength="4" maxlength="10" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="pwd" class="form-label">Password</label>
                        <input type="password" class="form-control" id="pwd" minlength="4" maxlength="10" name="pwd" required>
                    </div>
                    <div style="text-align: center;">
                        <input type="submit" class="btn btn-dark" value="Register">
                    </form>
                    <br>
                        Already registered? <a href="/userlogin" style="color:hwb(271 4% 32%);">Login</a>
                    </div>
                </form>
            </div>
    </div>
</body>
</html>
