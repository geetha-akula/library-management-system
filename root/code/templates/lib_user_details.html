<!DOCTYPE html>
<html lang="en">
<head>
    <title>Librarian Dashboard</title>
    <link rel="stylesheet" href="/static/lib_form.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
    <body>
        <div id="main">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                    <a class="navbar-brand" href="#">Librarian's Dashboard</a>
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="/librarian_dash">Home</a>
                        <a class="nav-link active" aria-current="page" href="/librarian_dash/requests">Requests</a>
                        <a class="nav-link active" aria-current="page" href="/stats">Stats</a>
                        <a class="nav-link active" aria-current="page" href="/">Logout</a>
                        <span>
                        <a class="nav-link active" aria-current="page" href="#">Admin</a>
                        </span>
                    </div>
                    </div>
                </nav>
                <h4 id="headings">User details</h4>
                <form>
                    <div id="lib-form">
                        <div class="mb-3">
                            <label for="u_name" class="form-label">Username:</label>
                            <input type="text" class="form-control" id="u_name" name="u_name" value="{{issue.user.username}}" readonly> 
                        </div>
                        <div class="mb-3">
                            <label for="title" class="form-label">Book Title:</label>
                            <input type="text" class="form-control" id="tile" name="title" value="{{issue.book_name}}" readonly> 
                        </div>
                        <div class="mb-3">
                            <label for="section" class="form-label">Section:</label>
                            <input type="text" class="form-control" id="section" name="section" value="{{issue.section_name}}" readonly> 
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status:</label>
                            <input type="text" class="form-control" id="status" name="status" value="{{issue.status}}" readonly>
                        </div>
                        <div>
                            <a href="/librarian_dash/requests"><button type="button" class="btn btn-danger" style="float: left; margin-left: 30px;">cancel</button></a>
                            <a href="/librarian/view_book/{{issue.book_id}}"><button type="button" class="btn btn-success" style="float: right; margin-right: 50px";>view book</button></a>
                        </div>
                    </div>
                </div>
            </div>
    </body>
</html>
