<!DOCTYPE html>
<html lang="en">
<head>
    <title>Librarian Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
    <body>
        <div id="main">
            <div id="dashboard">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                    <a class="navbar-brand" href="#">Librarian's Dashboard</a>
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="/librarian_dash">Home</a>
                        <a class="nav-link active" aria-current="page" href="/librarian_dash/requests">Requests</a>
                        <a class="nav-link active" aria-current="page" href="/stats">Stats</a>
                        <a class="nav-link active" aria-current="page" href="/">Logout</a>
                        <span>
                        <a class="nav-link active" aria-current="page" href="#">Admin</a>
                        </span>
                    </div>
                    </div>
                    </div>
                </nav>
                <div style="float: right; margin-top: 5px;">
                    <form class="d-flex" role="search" action="/section/{{section.id}}" method="POST">
                        <input class="form-control me-2" type="text" placeholder="Search" aria-label="Search" name="search_word">
                        <button class="btn btn-outline-dark" type="submit">Search</button>
                    </form>
                </div>
                <h4 id="headings">{{section.title}} Books</h4>
                {% if books| length == 0 %}
                <p>No books available</p>
                {% else %}
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">S.No</th>
                            <th scope="col">Title</th>
                            <th scope="col">Author</th>
                            <th scope="col">Section</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    {% for book in books %}
                    <tbody>
                      <tr>
                        <th scope="row">{{loop.index}}</th>
                        <td>{{book.title}}</td>
                        <td>{{book.author}}</td>
                        <td>{{book.section.title}}</td>
                        <td>
                            <a href="/librarian/view_book/{{book.id}}"><button type="button" class="btn btn-success">view</button></a>
                            <a href="/update_book/{{book.id}}"><button type="button" class="btn btn-warning">edit</button></a>
                            <a href="/delete_book/{{book.id}}"><button type="button" class="btn btn-danger">delete</button></a>
                        </td>
                      </tr>
                    </tbody>
                    {% endfor %}
                    {% endif %}
                </table>
                <a href="/section/{{section.id}}/add_book"><button type="button" class="btn btn-dark">+</button></a>
            </div>
        </div>
    </body>
</html>
