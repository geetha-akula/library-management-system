<!DOCTYPE html>
<html lang="en">
<head>
    <title>Librarian Dashboard</title>
    <link rel="stylesheet" href="/static/lib_form.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
    <body>
        <div id="main">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                    <a class="navbar-brand" href="#">Librarian's Dashboard</a>
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="/librarian_dash">Home</a>
                        <a class="nav-link active" aria-current="page" href="/requests">Requests</a>
                        <a class="nav-link active" aria-current="page" href="/stats">Stats</a>
                        <a class="nav-link active" aria-current="page" href="/">Logout</a>
                        <span>
                        <a class="nav-link active" aria-current="page" href="#">Admin</a>
                        </span>
                    </div>
                    </div>
                </nav>
                <h4 id="headings">Edit section</h4>
                <form action="/update_section/{{section.id}}" method="POST">
                    <div id="lib-form">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title:</label>
                            <input type="text" class="form-control" id="tile" minlength="5" maxlength="20" name="title" value="{{section.title}}" required> 
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description:</label>
                            <textarea class="form-control" id="description" rows="2" minlength="5" maxlength="500" name="description" required>{{section.description}}</textarea>
                        </div>
                        <div>
                            <a href="/librarian_dash"><button type="button" class="btn btn-danger" style="float: left; margin-left: 30px;">cancel</button></a>
                            <button type="submit" class="btn btn-success" style="float: right; margin-right: 50px";>update</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
